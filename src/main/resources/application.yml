spring:
  application:
    name: votacao
  threads:
    virtual:
       enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/votacao}
    username: ${DB_USER:votacao}
    password: ${DB_PASSWORD:votacao}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8081}

app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  user-info:
    modo: ${USER_INFO_MODO:fake}            # fake | http | desabilitado
    url: ${USER_INFO_URL:https://user-info.herokuapp.com}
    timeout: ${USER_INFO_TIMEOUT:3s}
    chance-apto: ${USER_INFO_CHANCE_APTO:0.5}  # usado só no modo fake